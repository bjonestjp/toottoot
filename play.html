<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>toot - player</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Special+Gothic+Condensed+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/play.css?v=9">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/paho-mqtt/1.0.1/mqttws31.min.js"></script>
</head>
<body>
    <div id="join-view" class="view active">
        <h1>join game</h1>
        <div class="input-group">
            <input type="text" id="player-name" placeholder="your name" autocomplete="off" autocorrect="off">
        </div>
        <div class="input-group">
            <input type="text" id="room-code" placeholder="room code" autocomplete="off" autocorrect="off">
        </div>
        <button id="join-btn" class="primary-btn">join</button>
        <div id="error-message" class="error hidden"></div>
    </div>

    <div id="waiting-view" class="view">
        <h2 id="waiting-name"></h2>
        <div class="pulse-text">connected! waiting for host to start...</div>
        <button id="btn-create-tune" class="primary-btn" style="margin-top: 30px;">create a tune ✏️</button>
    </div>

    <div id="sequencer-view" class="view">
        <div class="seq-header">
            <button id="btn-seq-back" class="seq-icon-btn">🔙</button>
            <input type="text" id="seq-name" placeholder="song name" autocomplete="off" autocorrect="off">
        </div>
        <div class="seq-controls">
            <div class="seq-bpm">
                <label for="seq-bpm-slider">bpm: <span id="seq-bpm-val">120</span></label>
                <input type="range" id="seq-bpm-slider" min="60" max="160" value="120">
            </div>
            <button id="btn-seq-timesig" class="seq-timesig-btn">4/4</button>
        </div>
        
        <div id="seq-strip" class="seq-strip"></div>
        
        <div id="seq-palette" class="seq-palette"></div>
        
        <div class="seq-actions">
            <button id="btn-seq-preview" class="seq-action-btn" title="preview">▶</button>
            <button id="btn-seq-submit" class="seq-action-btn" title="submit to game">📤</button>
            <button id="btn-seq-save" class="seq-action-btn" title="save code">💾</button>
            <button id="btn-seq-load" class="seq-action-btn" title="load code">📂</button>
        </div>
    </div>

    <div id="playing-view" class="view">
        <div class="player-top-bar">
            <div class="player-song-info">
                <span id="player-song-emoji">🎵</span>
                <span id="player-song-title">song</span>
                <span id="player-mode-badge" class="player-mode-badge badge-rehearsal">rehearsal</span>
            </div>
            <div id="starting-note-banner" class="starting-banner">🌟 you play the first note!</div>
        </div>

        <div id="note-buttons-container"></div>

        <div id="conductor-controls" class="conductor-controls hidden">
            <button id="btn-start-performance" class="btn-conductor-start">🎼 start performance</button>
        </div>
    </div>

    <div id="countdown-overlay" class="countdown-overlay hidden">
        <div class="player-countdown-title">showtime in</div>
        <div id="player-countdown-text">3</div>
    </div>

    <div id="fail-overlay" class="overlay hidden"></div>
    
    <div id="win-view" class="view">
        <div class="win-content">
            <h1>🎉 success! 🎉</h1>
            <p id="win-message"></p>
            <div class="pulse-text">waiting for next round...</div>
        </div>
    </div>

    <script type="module" src="js/play.js?v=9"></script>
</body>
</html>
